services:
  - type: web
    name: browser-server
    runtime: docker          # חובה: ב-Native אין אפשרות להתקין את תלויות Chromium
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    branch: main
    # ב-Docker אין buildCommand - הכל נעשה ב-Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
